<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BFE3F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="소금의 하루">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>소금의 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #E9F4FB;
    --header: #BFE3F5;
    --surface: #FFFFFF;
    --surface2: #F2F8FC;
    --ink: #1F3A52;
    --muted: #5F7B93;
    --line: #CFE3F0;
    --accent: #3D8FD1;
    --accent-ink: #FFFFFF;
    --danger: #C9635A;
    --chip-wake: #FFE9B5;
    --chip-feed: #FFD6C2;
    --chip-nap: #DCD6F7;
    --chip-play: #CDEFD9;
    --chip-bath: #BFE6F2;
    --chip-bed: #C9D9F7;
    --chip-ink: #1F3A52;
    --shadow: 0 2px 10px rgba(31, 58, 82, 0.08);
    --focus: #3D8FD1;
    --scrim: rgba(31, 58, 82, 0.35);
    --hdr-ink: #1F3A52;
    --hdr-sub: #4C6C88;
    --hdr-btn: rgba(255,255,255,0.5);
    --now-line: #3D8FD1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1B27; --header: #1B3A52; --surface: #172635; --surface2: #1E3042;
      --ink: #E6F0F7; --muted: #93AEC4; --line: #2A4256; --accent: #6FB6EA; --accent-ink: #0F1B27;
      --danger: #E48A82;
      --chip-wake: #5A4A1F; --chip-feed: #5E3A2C; --chip-nap: #3B3560; --chip-play: #234A36; --chip-bath: #1F4A5A; --chip-bed: #2A3D5E;
      --chip-ink: #E6F0F7; --shadow: 0 2px 10px rgba(0, 0, 0, 0.35); --scrim: rgba(0, 0, 0, 0.55);
      --hdr-ink: #E6F0F7; --hdr-sub: #B7CCDD; --hdr-btn: rgba(255,255,255,0.12); --now-line: #6FB6EA;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1B27; --header: #1B3A52; --surface: #172635; --surface2: #1E3042;
    --ink: #E6F0F7; --muted: #93AEC4; --line: #2A4256; --accent: #6FB6EA; --accent-ink: #0F1B27;
    --danger: #E48A82;
    --chip-wake: #5A4A1F; --chip-feed: #5E3A2C; --chip-nap: #3B3560; --chip-play: #234A36; --chip-bath: #1F4A5A; --chip-bed: #2A3D5E;
    --chip-ink: #E6F0F7; --shadow: 0 2px 10px rgba(0, 0, 0, 0.35); --scrim: rgba(0, 0, 0, 0.55);
    --hdr-ink: #E6F0F7; --hdr-sub: #B7CCDD; --hdr-btn: rgba(255,255,255,0.12); --now-line: #6FB6EA;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

  header.top {
    position: sticky; top: 0; z-index: 5; background: var(--header);
    padding: 12px 16px 10px; display: flex; align-items: center; gap: 12px;
  }
  header.top .icon { width: 48px; height: 48px; flex: none; }
  header.top h1 {
    margin: 0; font-family: "Gowun Dodum", "Noto Sans KR", sans-serif;
    font-weight: 400; font-size: 24px; letter-spacing: 0.02em; line-height: 1.1; color: var(--hdr-ink);
  }
  header.top .date { font-size: 12.5px; color: var(--hdr-sub); margin-top: 2px; }
  header.top .spacer { flex: 1; }
  .iconbtn {
    width: 38px; height: 38px; border-radius: 50%; border: 0;
    background: var(--hdr-btn); color: var(--hdr-ink); display: grid; place-items: center;
  }

  main { flex: 1; padding: 14px 12px 40px; }

  .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }

  .startbox { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .startbox input[type="time"] {
    flex: 1; min-width: 150px; padding: 10px 8px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface2); font-size: 20px; font-variant-numeric: tabular-nums; text-align: center;
  }
  .startbox .pm { width: 44px; height: 46px; flex: none; }
  .startbox .btn { flex: 1; }
  .btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
  .btn.secondary { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  .btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }

  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); border-left: 5px solid transparent; overflow: hidden; }
  .row.now { border-left-color: var(--now-line); box-shadow: 0 0 0 2.5px var(--now-line), var(--shadow); }
  .row.past { opacity: 0.6; }
  .row .head {
    display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center;
    padding: 11px 12px 11px 10px; width: 100%; border: 0; background: transparent; text-align: left; color: inherit;
  }
  .row button.head { cursor: pointer; grid-template-columns: 92px 1fr auto; }
  .row div.head { cursor: default; }
  .row .chev { width: 22px; height: 22px; color: var(--muted); transition: transform .15s; flex: none; }
  .row .chev.open { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .row .chev { transition: none; } }
  .row .time { font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--muted); line-height: 1.3; }
  .row .time b { display: block; color: var(--ink); font-weight: 700; font-size: 14.5px; }
  .row .time.actual b { color: var(--accent); }
  .row .title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row .sub { font-size: 12.5px; color: var(--muted); }
  .chip { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--chip-ink); }
  .chip.wake { background: var(--chip-wake); }
  .chip.bed { background: var(--chip-bed); }
  .chip.feed { background: var(--chip-feed); }
  .chip.nap { background: var(--chip-nap); }
  .chip.play { background: var(--chip-play); }
  .chip.bath { background: var(--chip-bath); }

  .editor { padding: 6px 12px 14px 15px; border-top: 1px dashed var(--line); background: var(--surface2); }
  .editor label { display: block; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin: 6px 0 5px; }
  .timeinput { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .timeinput input[type="time"] {
    flex: 1; min-width: 120px; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); font-variant-numeric: tabular-nums; font-size: 16px; text-align: center;
  }
  .pm { width: 36px; height: 40px; flex: none; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 18px; line-height: 1; }
  .editor .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .menu {
    position: absolute; right: 12px; top: 62px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; z-index: 8; min-width: 180px;
  }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 11px 14px; }
  .menu button:hover { background: var(--surface2); }
  .menu button.danger { color: var(--danger); }

  .modal { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: grid; place-items: center; padding: 20px; }
  .modal .box { background: var(--surface); border-radius: 16px; padding: 18px; max-width: 360px; width: 100%; box-shadow: var(--shadow); }
  .modal .box p { margin: 0 0 14px; font-size: 15px; }
  .modal .box .actions { display: flex; gap: 8px; justify-content: flex-end; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  /* v5-add */
  .flabel { display: block; font-size: 12.5px; color: var(--muted); letter-spacing: 0.04em; margin: 10px 0 4px; }
  .textinput { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); font-size: 16px; }
  .hint { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
  .empty { margin: 6px 0 12px; color: var(--muted); font-size: 14px; }
  .cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .cardhead h2 { margin: 0; }
  .plist { margin-top: 6px; display: flex; flex-direction: column; gap: 8px; }
  .pitem { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface2); border-radius: 12px; padding: 10px 12px; }
  .pitem.static { margin-bottom: 8px; }
  .pitem .pname { display: block; font-weight: 700; font-size: 15px; }
  .pitem .psub { display: block; font-size: 12.5px; color: var(--muted); }
  .pitem .pacts { display: flex; gap: 6px; flex: none; }
  .btn.danger { color: var(--danger); }
  .pecard { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px 12px; }
  .pecard .pehead { display: flex; align-items: center; gap: 8px; }
  .pecard .pedur { flex: 1; font-size: 12.5px; color: var(--muted); }
  .pecard label { display: block; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin: 8px 0 4px; }
  .linkbtn { border: 0; background: transparent; padding: 4px 6px; font-size: 13px; }
  .linkbtn.danger { color: var(--danger); }
  .addbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 12px; }
  .card .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .editor .dur { font-size: 12.5px; color: var(--muted); margin-top: 8px; min-height: 1.2em; }
  .toprow { display: flex; gap: 8px; margin-bottom: 12px; }
  .toprow .btn { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
  .check input { width: 18px; height: 18px; }
  .card .actions .grow { flex: 1; }
  .card .actions { flex-wrap: wrap; align-items: center; }
  .psub.center { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); vertical-align: middle; }
  .sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0 6px; }
  /* /v5-add */
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M10 64 C12 52 20 47 32 47 C44 47 52 52 54 64 Z" fill="#BFE3F5"/>
      <ellipse cx="32" cy="32" rx="24" ry="22" fill="#FFE3CF"/>
      <ellipse cx="25" cy="16" rx="6" ry="2.6" fill="#FFFFFF" opacity="0.55"/>
      <ellipse cx="32" cy="46" rx="14" ry="4" fill="#F3C9AE" opacity="0.7"/>
      <circle cx="23" cy="30" r="2.2" fill="#1F3A52"/>
      <circle cx="41" cy="30" r="2.2" fill="#1F3A52"/>
      <path d="M19.5 25.5 q3.5 -2 7 0" stroke="#D9A98C" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M37.5 25.5 q3.5 -2 7 0" stroke="#D9A98C" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <circle cx="15.5" cy="37" r="4" fill="#FFB8B0" opacity="0.85"/>
      <circle cx="48.5" cy="37" r="4" fill="#FFB8B0" opacity="0.85"/>
      <ellipse cx="32" cy="40.5" rx="8" ry="5" fill="#6FB6EA"/>
      <circle cx="32" cy="39.5" r="2.4" fill="#BFE3F5"/>
      <circle cx="32" cy="44.5" r="3.6" fill="none" stroke="#3D8FD1" stroke-width="2.2"/>
    </svg>
    <div>
      <h1>소금의 하루</h1>
      <div class="date" id="hdrDate"></div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="menuBtn" aria-label="메뉴">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <div class="menu" id="menu" hidden></div>
  </header>

  <main id="view"></main>

  <div class="toast" id="toast"></div>
  <div class="modal" id="modal" hidden>
    <div class="box">
      <p id="modalMsg"></p>
      <div class="actions"><button class="btn secondary" data-act="modal-cancel">취소</button><button class="btn" data-act="modal-ok">확인</button></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'saltday.v5';
  var SYNC_URL = 'https://salt-planner-default-rtdb.asia-southeast1.firebasedatabase.app/salt/v5';
  var WAKE_FLOOR = 6 * 60;        // 6:00 이전 기상은 밤잠 연장으로 보고 6:00을 하루 시작으로. 6:00 이후는 실제 기상 시각이 시작
  var WAKE_DEFAULT = 6 * 60 + 30; // 시작 화면 기본값
  var DAY_MAX = 12 * 60;          // 잠든 시각 상한: 기상 + 12:00
  var DAY_MIN = 11 * 60;          // 잠든 시각 하한: 기상 + 11:00
  var FEED_MIN = 150, FEED_MAX = 210;   // 수유 텀은 불가피할 때만 2시간 30분 ~ 3시간 30분 안에서 조정
  var BED_FEED_MIN = 120;         // 취침이 당겨진 날 마지막 수유를 당겨도 안 되면 입면 수유텀은 2:00까지 허용
  var NAP_FEED_GAP = 10;          // 낮잠이 늦게 끝나면 수유는 낮잠 종료 최소 10분 뒤
  var MIN_PLAY = 10;              // 이보다 짧은 빈틈은 놀이 카드로 보이지 않는다

  // 기본 루틴 (6:30 기상 기준 카드 목록). 프리셋도 같은 형식이다: t 종류, s 시작, e 종료 (분)
  var M = function (h, m) { return h * 60 + m; };
  var DEFAULT_ITEMS = [
    { t: 'wake', s: M(6, 30), e: M(6, 30) },
    { t: 'feed', s: M(6, 30), e: M(6, 45) },
    { t: 'nap', s: M(8, 0), e: M(8, 50) },
    { t: 'feed', s: M(9, 0), e: M(9, 15) },
    { t: 'nap', s: M(10, 30), e: M(12, 15) },
    { t: 'feed', s: M(12, 15), e: M(12, 30) },
    { t: 'nap', s: M(14, 0), e: M(14, 30) },
    { t: 'feed', s: M(15, 15), e: M(15, 30) },
    { t: 'nap', s: M(16, 10), e: M(16, 45) },
    { t: 'bath', s: M(17, 45), e: M(18, 0) },
    { t: 'bed', s: M(18, 0), e: M(18, 30) }
  ];
  var LABEL = { wake: '기상', play: '놀이', nap: '낮잠', feed: '수유', bath: '목욕', bed: '수유 후 입면' };
  var CIRC = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
  var TYPE_ORDER = { wake: 0, feed: 1, nap: 2, bath: 3, bed: 4 };
  function circ(n) { return CIRC[n] || ('(' + (n + 1) + ')'); }
  function isFeedType(t) { return t === 'feed' || t === 'bed'; }

  var state = load();
  var ui = { mode: null, open: null, draft: null, start: null, pe: null };
  var pendingConfirm = null;

  function now() { return Date.now(); }
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) { var s = JSON.parse(raw); if (s && s.days) { s.presets = s.presets || {}; s.def = s.def || null; return s; } } } catch (e) {}
    return { days: {}, presets: {}, def: null };
  }
  function save(push) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    if (push !== false) syncPush();
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hm(min) { if (min == null || isNaN(min)) return ''; min = ((min % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
  function parseHM(s) { if (!s) return null; var p = s.split(':'); var v = parseInt(p[0], 10) * 60 + parseInt(p[1], 10); return isNaN(v) ? null : v; }
  function fmtTerm(min) { return Math.floor(min / 60) + ':' + pad(min % 60); }
  // 길이 표기: 1시간 10분 / 1시간 / 30분
  function fmtDur(min) {
    if (min == null || isNaN(min)) return '';
    if (min < 0) return '종료가 시작보다 앞';
    var h = Math.floor(min / 60), m = min % 60;
    if (h && m) return h + '시간 ' + m + '분';
    if (h) return h + '시간';
    return m + '분';
  }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function todayKey() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtDate(key) { var p = key.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return +p[1] + '월 ' + +p[2] + '일 (' + '일월화수목금토'[d.getDay()] + ')'; }
  // 태어난 날을 1일로 세는 한국식 (2026-09-09 = 100일)
  function ageDays() { var b = new Date(2026, 5, 2); var p = todayKey().split('-'); var t = new Date(+p[0], +p[1] - 1, +p[2]); return Math.round((t - b) / 86400000) + 1; }
  function sid() { return now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function getDay(k) { var d = state.days[k]; return (d && !d.del) ? d : null; }
  function sortItems(items) { return items.slice().sort(function (a, b) { return (a.s - b.s) || (TYPE_ORDER[a.t] - TYPE_ORDER[b.t]); }); }

  // ---- 루틴 템플릿: 카드 목록(프리셋)에서 규칙 엔진이 쓰는 값을 뽑는다 ----
  // 낮잠: 직전 잠 종료로부터의 깨시(ww)와 길이. 수유: 기상으로부터의 시각(off)과 길이, 직전 낮잠 종료와의 최소 간격(gap).
  // 목욕: 길이와 입면까지의 간격. 수유 후 입면: 마지막 낮잠 종료로부터의 간격(lastGap)과 길이.
  function templateOf(items) {
    var its = sortItems(items);
    var wake = null; its.forEach(function (x) { if (x.t === 'wake' && !wake) wake = x; });
    var w0 = wake ? wake.s : its[0].s;
    var slots = [{ t: 'wake', id: 'wake' }], ni = 0, fi = 0, prevSleepEnd = w0, prevNapEnd = null, bath = null, bed = null, prevFeedS = null;
    its.forEach(function (x) {
      if (x.t === 'nap') { slots.push({ t: 'nap', id: 'nap' + ni, ww: Math.max(x.s - prevSleepEnd, 0), len: Math.max(x.e - x.s, 0) }); ni++; prevSleepEnd = x.e; prevNapEnd = x.e; }
      else if (x.t === 'feed') {

    if (it.type === 'bed') { var nf = 0; for (var q2 = 0; q2 < i; q2++) if (items[q2].type === 'feed') nf++; return LABEL.bed + ' ' + circ(nf); }
    return LABEL[it.type];
  }
  function timeCtl(f, val, opts) {
    opts = opts || {};
    return '<div class="timeinput"><button class="pm" data-act="' + (opts.act || 'tm') + '" data-f="' + f + '" data-d="-1"' + (opts.k ? ' data-k="' + opts.k + '"' : '') + ' aria-label="1분 빼기">−</button>' +
      '<input type="time" data-f="' + f + '"' + (opts.k ? ' data-k="' + opts.k + '"' : '') + ' value="' + hm(val) + '">' +
      '<button class="pm" data-act="' + (opts.act || 'tm') + '" data-f="' + f + '" data-d="1"' + (opts.k ? ' data-k="' + opts.k + '"' : '') + ' aria-label="1분 더하기">+</button>' +
      (opts.now ? '<button class="btn secondary small" data-act="' + opts.now + '" data-f="' + f + '">지금</button>' : '') + '</div>';
  }
  function renderStart() {
    if (!ui.start) ui.start = { wake: WAKE_DEFAULT };
    var st = ui.start, presets = presetList();
    var h = '<div class="card"><h2>오늘 하루를 시작하기</h2>' +
      '<label class="flabel">기상 시각</label>' + timeCtl('swake', st.wake, { act: 'stm', now: 'snow' }) +
      '<div class="startbox"><button class="btn" data-act="start">기본 루틴으로 시작</button></div>';
    if (presets.length) {
      h += '<hr class="sep"><div class="plist"><div class="flabel">프리셋으로 시작</div>';
      presets.forEach(function (p) {
        var isDef0 = defaultPreset() && defaultPreset().id === p.id;
        h += '<button class="pitem" data-act="start-preset" data-id="' + p.id + '"><span><span class="pname">' + esc(p.name) + (isDef0 ? ' <span class="badge">기본</span>' : '') + '</span><span class="psub">' + presetSummary(p.items) + '</span></span></button>';
      });
      h += '</div>';
    }
    return h + '</div>';
  }
  function renderPresetList() {
    var presets = presetList();
    var h = '<div class="toprow"><button class="btn secondary" data-act="pl-close">시간표로 돌아가기</button><button class="btn" data-act="preset-new">프리셋 만들기</button></div>' +
      '<div class="card"><h2>프리셋 목록</h2>';
    if (!presets.length) h += '<p class="empty">저장된 프리셋이 없어요.</p>';
    presets.forEach(function (p) {
      var isDef = defaultPreset() && defaultPreset().id === p.id;
      h += '<div class="pitem static"><div><div class="pname">' + esc(p.name) + (isDef ? ' <span class="badge">기본</span>' : '') + '</div><div class="psub">' + presetSummary(p.items) + '</div></div>' +
        '<div class="pacts"><button class="btn secondary small" data-act="pl-edit" data-id="' + p.id + '">수정</button><button class="btn secondary small danger" data-act="pl-del" data-id="' + p.id + '">삭제</button></div></div>';
    });
    h += '</div>';
    return h;
  }
  function renderPresetEditor() {
    var pe = ui.pe, sorted = sortItems(pe.items);
    var h = '<div class="card"><div class="cardhead"><h2>' + (pe.id ? '프리셋 수정' : '프리셋 만들기') + '</h2></div>' +
      '<label class="flabel">프리셋 이름</label><input class="textinput" id="peName" type="text" maxlength="30" placeholder="예: 평일 루틴" value="' + esc(pe.name) + '"></div>';
    h += '<div class="rows">';
    pe.items.forEach(function (x) {
      var idx = sorted.indexOf(x), fixed = x.t === 'wake' || x.t === 'bed';
      h += '<div class="pecard" data-k="' + x.k + '"><div class="pehead"><span class="chip ' + x.t + '">' + labelOfPe(sorted, idx) + '</span>' +
        '<span class="pedur">' + peInfo(sorted, idx) + '</span>' +
        (fixed ? '' : '<button class="linkbtn danger" data-act="pe-del" data-k="' + x.k + '">삭제</button>') + '</div>' +
        '<label>' + (x.t === 'wake' ? '기상 시각' : '시작') + '</label>' + timeCtl('s', x.s, { act: 'ptm', k: x.k }) +
        (x.t === 'wake' ? '' : '<label>종료</label>' + timeCtl('e', x.e, { act: 'ptm', k: x.k })) + '</div>';
    });
    h += '</div>';
    var hasBath = pe.items.some(function (x) { return x.t === 'bath'; });
    h += '<div class="card"><div class="flabel">카드 추가</div><div class="addbar">' +
      '<button class="btn secondary small" data-act="pe-add" data-t="nap">+ 낮잠</button>' +
      '<button class="btn secondary small" data-act="pe-add" data-t="feed">+ 수유</button>' +
      (hasBath ? '' : '<button class="btn secondary small" data-act="pe-add" data-t="bath">+ 목욕</button>') + '</div>' +
      '<div class="actions"><label class="check"><input type="checkbox" id="peDefault"' + (pe.makeDefault ? ' checked' : '') + '> 기본 루틴으로 만들기</label>' +
      '<span class="grow"></span><button class="btn secondary" data-act="pe-cancel">취소</button><button class="btn" data-act="pe-save">저장</button></div></div>';
    return h;
  }
  function renderDay(day) {
    var n = nowMin(), h = '<div class="rows">', items = day.items;
    items.forEach(function (it, i) {
      var isNow = it.ps <= n && n < it.pe;
      var past = it.pe <= n && !isNow;
      var rec = day.rec && day.rec[it.id];
      var hasActual = !!(rec && (rec.as != null || rec.ae != null));
      var extra = '';
      if (it.type === 'nap') extra = '<span class="sub">수면 ' + fmtTerm(it.pe - it.ps) + '</span>';
      if (isFeedType(it.type)) {
        // 수유 텀: 직전 수유 시작부터 이 수유 시작까지
        var pf = null; for (var q2 = i - 1; q2 >= 0; q2--) if (isFeedType(items[q2].type)) { pf = items[q2]; break; }
        if (pf) extra = '<span class="sub">수유텀 ' + fmtTerm(it.ps - pf.ps) + '</span>';
      }
      if (it.type !== 'nap' && items[i + 1] && items[i + 1].type === 'nap') {
        // 깨시: 직전 잠(기상 또는 낮잠) 종료부터 다음 낮잠 시작까지. 낮잠 바로 앞 카드(놀이 또는 수유)에 표시
        var from = null;
        for (var k = i; k >= 0; k--) { if (items[k].type === 'nap' || items[k].type === 'wake') { from = items[k].pe; break; } }
        if (from != null) extra += (extra ? ' ' : '') + '<span class="sub">깨시 ' + fmtTerm(items[i + 1].ps - from) + '</span>';
      }
      if (it.type === 'bed') {
        var lastSleep = null; for (var q = i - 1; q >= 0; q--) if (items[q].type === 'nap' || items[q].type === 'wake') { lastSleep = items[q]; break; }
        if (lastSleep) extra += '<span class="sub">깨시 ' + fmtTerm(it.pe - lastSleep.pe) + '</span>';
      }
      var tappable = it.type === 'nap' || isFeedType(it.type) || it.type === 'wake';
      var timeHtml = it.type === 'wake' ? '<b>' + hm(it.ps) + '</b>' : '<b>' + hm(it.ps) + '</b>' + hm(it.pe);
      var inner = '<div class="time' + (hasActual ? ' actual' : '') + '">' + timeHtml + '</div>' +
        '<div class="title"><span class="chip ' + it.type + '">' + labelOf(items, i) + '</span>' + extra + '</div>';
      h += '<div class="row' + (isNow ? ' now' : '') + (past ? ' past' : '') + '">' +
        (tappable ? '<button class="head" data-act="toggle" data-id="' + it.id + '" aria-expanded="' + (ui.open === it.id) + '">' + inner +
                      '<svg class="chev' + (ui.open === it.id ? ' open' : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>'
                  : '<div class="head">' + inner + '</div>') +
        (tappable && ui.open === it.id ? renderEditor(it) : '') +
      '</div>';
    });
    return h + '</div>';
  }
  function renderEditor(it) {
    var d = ui.draft || { as: it.ps, ae: it.pe };
    if (it.type === 'wake') {
      return '<div class="editor" data-id="' + it.id + '"><label>기상 시각</label>' + timeCtl('as', d.as, { now: 'now' }) +
        '<div class="actions"><button class="btn secondary small" data-act="cancel">취소</button><button class="btn small" data-act="save">저장</button></div></div>';
    }
    return '<div class="editor" data-id="' + it.id + '">' +
      '<label>실제 시작</label>' + timeCtl('as', d.as, { now: 'now' }) +
      '<label>' + (it.type === 'bed' ? '입면 (잠든 시각)' : '실제 종료') + '</label>' + timeCtl('ae', d.ae, { now: 'now' }) +
      '<div class="dur">' + (d.as != null && d.ae != null ? '시작~종료 ' + fmtDur(d.ae - d.as) : '') + '</div>' +
      '<div class="actions"><button class="btn secondary small" data-act="cancel">취소</button><button class="btn small" data-act="save">저장</button></div></div>';
  }
  // 시작을 바꾸면 종료도 같은 길이만큼 따라간다 (그 뒤에 종료만 따로 고칠 수 있다)
  function setDraft(f, v) {
    var d = ui.draft; if (!d || v == null) return;
    if (f === 'as' && d.as != null && d.ae != null) d.ae = d.ae + (v - d.as);
    d[f] = v;
  }
  function setPeTime(k, f, v) {
    var pe = ui.pe; if (!pe || v == null) return;
    var x = null; pe.items.forEach(function (y) { if (y.k === k) x = y; }); if (!x) return;
    if (f === 's') { x.e = x.t === 'wake' ? v : x.e + (v - x.s); x.s = v; } else x.e = v;
  }

  // ---- 공유 저장소 (Firebase Realtime Database REST). 링크를 연 모두가 같은 일정을 본다 ----
  var sync = { pushTimer: null, pulling: false };
  function endpoint() { return SYNC_URL + '.json'; }
  function syncPull(cb) {
    if (sync.pulling) { cb && cb(false); return; }
    sync.pulling = true;
    fetch(endpoint() + '?t=' + now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (remote) {
        sync.pulling = false;
        if (mergeState(remote)) { save(false); render(); }
        if ((!remote || (!remote.days && !remote.presets)) && (Object.keys(state.days).length || Object.keys(state.presets).length)) syncPushNow();
        cb && cb(true);
      })
      .catch(function () { sync.pulling = false; cb && cb(false); });
  }
  function syncPush() {
    clearTimeout(sync.pushTimer);
    sync.pushTimer = setTimeout(function () { syncPull(function () { syncPushNow(); }); }, 800);
  }
  function syncPushNow() {
    fetch(endpoint(), { method: 'PUT', body: JSON.stringify(state) }).catch(function () {});
  }
  // 세션(sid)이 다르면 더 최근 세션이 통째로 이기고, 같으면 기록을 나중에 고친 쪽이 이긴다. 일정은 그로부터 다시 계산한다. 프리셋은 나중에 고친 쪽이 이긴다
  function mergeState(remote) {
    if (!remote) return false;
    var changed = false;
    Object.keys(remote.days || {}).forEach(function (k) {
      var rd = remote.days[k], ld = state.days[k];
      if (!rd) return;
      rd.rec = rd.rec || {}; rd.items = rd.items || [];
      if (!ld) { state.days[k] = rd; changed = true; return; }
      if (rd.sid !== ld.sid) {
        if ((rd.su || 0) > (ld.su || 0)) { state.days[k] = rd; changed = true; }
        return;
      }
      var dayChanged = false;
      if ((rd.su || 0) > (ld.su || 0)) { ld.start = rd.start; ld.del = rd.del; ld.su = rd.su; ld.preset = rd.preset; dayChanged = true; }
      ld.rec = ld.rec || {};
      Object.keys(rd.rec).forEach(function (key) {
        var r = rd.rec[key], l = ld.rec[key];
        if (!l || (r.u || 0) > (l.u || 0)) { ld.rec[key] = r; dayChanged = true; }
      });
      if (dayChanged) { if (!ld.del) buildDay(ld); changed = true; }
    });
    if (remote.def && (remote.def.u || 0) > ((state.def && state.def.u) || 0)) { state.def = remote.def; changed = true; }
    Object.keys(remote.presets || {}).forEach(function (id) {
      var rp = remote.presets[id], lp = state.presets[id];
      if (rp && (!lp || (rp.u || 0) > (lp.u || 0))) { state.presets[id] = rp; changed = true; }
    });
    return changed;
  }

  // ---- 확인창 ----
  function askConfirm(msg, fn) { pendingConfirm = fn; document.getElementById('modalMsg').textContent = msg; document.getElementById('modal').hidden = false; }
  function closeConfirm() { pendingConfirm = null; document.getElementById('modal').hidden = true; }

  // ---- 이벤트 ----
  function findItem(id) { var day = getDay(todayKey()); if (!day) return null; for (var i = 0; i < day.items.length; i++) if (day.items[i].id === id) return day.items[i]; return null; }
  function bump(cur, d) { if (cur == null) cur = nowMin(); return ((cur + d) % 1440 + 1440) % 1440; }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    var menu = document.getElementById('menu');
    if (!e.target.closest('#menuBtn')) menu.hidden = true;
    if (!b) return;
    var act = b.dataset.act;
    var editorEl = b.closest('.editor');
    var id = b.dataset.id || (editorEl && editorEl.dataset.id);
    var it = id ? findItem(id) : null;
    var d = parseInt(b.dataset.d, 10);
    if (act === 'modal-ok') { var fn = pendingConfirm; closeConfirm(); if (fn) fn(); return; }
    if (act === 'modal-cancel') { closeConfirm(); return; }
    // 시작 화면
    if (act === 'start') { if (!ui.start) return; startDay(ui.start.wake, null, null); return; }
    if (act === 'start-preset') { var p = state.presets[b.dataset.id]; if (!p || p.del) return; if (!ui.start) ui.start = { wake: WAKE_DEFAULT }; startDay(ui.start.wake, null, p); return; }
    if (act === 'stm' || act === 'snow') {
      if (!ui.start) return;
      ui.start.wake = act === 'snow' ? nowMin() : bump(ui.start.wake, d);
      render(); return;
    }
    // 카드 편집
    if (act === 'tm') { if (!it || !ui.draft) return; var f1 = b.dataset.f; setDraft(f1, bump(ui.draft[f1], d)); render(); return; }
    if (act === 'now') { if (!it || !ui.draft) return; setDraft(b.dataset.f || 'as', nowMin()); render(); return; }
    if (act === 'toggle') {
      if (ui.open === id) { ui.open = null; ui.draft = null; }
      else { ui.open = id; ui.draft = { as: it.ps, ae: it.type === 'wake' ? null : it.pe }; }   // 기록이 없으면 계산된 계획 시각이 기본값
      render(); return;
    }
    if (act === 'cancel') { ui.open = null; ui.draft = null; render(); return; }
    if (act === 'save' && it && ui.draft) {
      var day = getDay(todayKey()); day.rec = day.rec || {};
      if (it.type === 'wake') {
        var ws = Math.max(ui.draft.as != null ? ui.draft.as : day.start, WAKE_FLOOR);
        day.rec.wake = { as: ws, ae: null, u: now() }; day.start = ws; day.su = now();   // 기상 시각 = 하루의 시작 (6:00 이전은 6:00)
      } else day.rec[it.id] = { as: ui.draft.as, ae: ui.draft.ae, u: now() };
      ui.open = null; ui.draft = null;
      var r = buildDay(day); save(); render();
      toast('입면 ' + hm(r.bedEnd) + ' 예정');
      return;
    }
    // 메뉴
    if (act === 'recalc') { recalc(); return; }
    if (act === 'reset-today') {
      var today = getDay(todayKey());
      if (!today) { toast('오늘은 아직 시작하지 않았어요'); return; }
      askConfirm('오늘 일정을 지우고 처음부터 다시 시작할까요?', function () {
        state.days[todayKey()] = { date: todayKey(), del: true, su: now(), sid: sid(), rec: {}, items: [] };
        ui.open = null; ui.draft = null; ui.mode = null; save(); render(); toast('오늘 일정을 지웠어요');
      });
      return;
    }
    if (act === 'preset-new') { openPresetEditor(null); return; }
    if (act === 'preset-list') { ui.mode = 'plist'; ui.open = null; render(); return; }
    // 프리셋 목록
    if (act === 'pl-close') { ui.mode = null; ui.pe = null; render(); return; }
    if (act === 'pl-edit') { var pe0 = state.presets[b.dataset.id]; if (pe0 && !pe0.del) openPresetEditor(pe0); return; }
    if (act === 'pl-del') { var pid = b.dataset.id, pp = state.presets[pid]; if (!pp) return; askConfirm('"' + pp.name + '" 프리셋을 지울까요?', function () { deletePreset(pid); }); return; }
    // 프리셋 편집
    if (act === 'ptm') {
      if (!ui.pe) return; var k = b.dataset.k, f2 = b.dataset.f, x = null;
      ui.pe.items.forEach(function (y) { if (y.k === k) x = y; }); if (!x) return;
      var nameEl0 = document.getElementById('peName'); if (nameEl0) ui.pe.name = nameEl0.value;
      setPeTime(k, f2, bump(x[f2], d)); render(); return;
    }
    if (act === 'pe-del') { if (!ui.pe) return; var nameEl1 = document.getElementById('peName'); if (nameEl1) ui.pe.name = nameEl1.value; ui.pe.items = ui.pe.items.filter(function (y) { return y.k !== b.dataset.k; }); render(); return; }
    if (act === 'pe-add') {
      if (!ui.pe) return; var nameEl2 = document.getElementById('peName'); if (nameEl2) ui.pe.name = nameEl2.value;
      var t = b.dataset.t, sorted = sortItems(ui.pe.items), bed = null, lastEnd = null;
      sorted.forEach(function (y) { if (y.t === 'bed') bed = y; else if (lastEnd == null || y.e > lastEnd) lastEnd = y.e; });
      var len = t === 'nap' ? 30 : 15, s0 = lastEnd != null ? lastEnd : (bed ? bed.s - 60 : M(12, 0));
      if (bed && s0 + len > bed.s) s0 = Math.max(bed.s - len, lastEnd != null ? lastEnd : 0);
      ui.pe.items.push({ k: newKey(), t: t, s: s0, e: s0 + len });
      render(); toast(LABEL[t] + ' 카드를 추가했어요. 시각을 조정해주세요'); return;
    }
    if (act === 'pe-save') { savePreset(); return; }
    if (act === 'pe-cancel') { ui.pe = null; ui.mode = 'plist'; render(); return; }
  });
  document.getElementById('menuBtn').addEventListener('click', function () { var m = document.getElementById('menu'); m.hidden = !m.hidden; });
  document.addEventListener('change', function (e) {
    var el = e.target; if (!el.dataset) return;
    if (el.id === 'peName' && ui.pe) { ui.pe.name = el.value; return; }
    if (el.id === 'peDefault' && ui.pe) { ui.pe.makeDefault = !!el.checked; return; }
    var f = el.dataset.f; if (!f) return;
    var v = parseHM(el.value); if (v == null) return;
    if (el.dataset.k && ui.pe) { setPeTime(el.dataset.k, f, v); render(); return; }
    if (f === 'swake') { if (!ui.start) return; ui.start.wake = v; render(); return; }
    if ((f === 'as' || f === 'ae') && el.closest('.editor') && ui.draft) { setDraft(f, v); render(); }
  });

  var toastTimer;
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400); }

  render();
  syncPull();
  setInterval(function () { if (!document.hidden) syncPull(); }, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) syncPull(); });
  setInterval(function () { if (ui.open == null && ui.mode == null) render(); }, 60000);
})();
</script>
